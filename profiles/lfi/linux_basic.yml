id: lfi_linux_basic
domain: lfi
description: Combine bounded Unix traversal depths with recognizable Linux read targets.

sets:
  traversal:
    catalog: lfi_traversal_steps_unix
    repeat:
      min: 1
      max: 6
  target:
    catalog: lfi_linux_targets_basic
  root:
    inline: [/]

patterns:
  - "{traversal}{target}"
  - "{root}{target}"

filters:
  dedupe: true
  max_length: 180
  max_outputs: 1000

output:
  file: output/lfi_linux_basic.txt
