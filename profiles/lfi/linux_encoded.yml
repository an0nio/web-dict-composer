id: lfi_linux_encoded
domain: lfi
description: Pair bounded encoded traversal depths with a compact Linux target set.

sets:
  traversal:
    catalogs:
      - lfi_traversal_steps_encoded
      - lfi_traversal_steps_double_encoded
    repeat:
      min: 1
      max: 4
  target:
    catalog: lfi_linux_targets_basic

patterns:
  - "{traversal}{target}"

filters:
  dedupe: true
  max_length: 220
  max_outputs: 2000

output:
  file: output/lfi_linux_encoded.txt
