id: lfi_log_targets
domain: lfi
description: Combine bounded Unix traversal depths with documented web-server log paths.

sets:
  traversal:
    catalog: lfi_traversal_steps_unix
    repeat:
      min: 1
      max: 6
  target:
    catalog: lfi_log_file_targets
  root:
    inline: [/]

patterns:
  - "{traversal}{target}"
  - "{root}{target}"

filters:
  dedupe: true
  max_length: 220
  max_outputs: 500

output:
  file: output/lfi_log_targets.txt
