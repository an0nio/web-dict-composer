    name: OWASP file upload testing guidance
    domain: file_upload
    kind: reference
    source: owasp
    path: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/10-Business_Logic_Testing/08-Test_Upload_of_Unexpected_File_Types
    tags: [file-upload, methodology, reference]
