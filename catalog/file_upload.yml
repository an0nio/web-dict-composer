    name: SecLists RAFT small extensions
    domain: file_upload
    kind: external_wordlist
    source: seclists
    path: Discovery/Web-Content/raft-small-extensions.txt
    tags: [file-upload, extensions, discovery, raft]
    description: Frequency-derived extension wordlist containing non-atomic and noisy values.

  - id: seclists_web_all_content_types
    name: SecLists web content types
    domain: file_upload
