  - id: patt_upload_insecure_files
    name: PayloadsAllTheThings upload reference
    domain: file_upload
    kind: reference
    source: payloadsallthethings
    path: https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/Upload%20Insecure%20Files
    tags: [file-upload, php, extensions, bypass, payloads, reference]
    description: Technique reference containing composed payloads that require manual review.

  - id: fuzzdb_upload_attack_patterns
    name: FuzzDB file upload reference
    domain: file_upload
    kind: reference
    source: fuzzdb
    path: https://github.com/fuzzdb-project/fuzzdb/tree/master/attack/file-upload
    tags: [file-upload, payloads, fuzzdb, reference]
    description: Legacy attack primitives and composed values; not an atom source.
